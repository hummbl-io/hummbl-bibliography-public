name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Bibliography & Search Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify bibliography manifest and shards
        run: python verify.py

      - name: Run offline citation search unit tests
        run: python -m unittest test_search.py -v

      - name: Run OpenAlex converter and verifier unit tests
        run: python -m unittest openalex/tests/test_convert_openalex.py -v
